<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MeTab-代码基础功能检查</title>

  <link rel="icon"
        href="icons/favicon.png"
        type="image/png">

<style>
:root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --text:#222;
    --sub:#666;
    --success:#16a34a;
    --border:#e5e7eb;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:480px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px;
    text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.05);
}

.icon{
    width:72px;
    height:72px;
    margin:0 auto 18px;
    border-radius:50%;
    background:#e8f7ee;
    color:var(--success);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:bold;
}

h1{
    font-size:24px;
    margin-bottom:10px;
}

.desc{
    color:var(--sub);
    line-height:1.7;
    margin-bottom:28px;
}

.info{
    border-top:1px solid var(--border);
    padding-top:20px;
}

.info p{
    margin:10px 0;
    font-size:15px;
}

.label{
    color:var(--sub);
}

.status{
    color:var(--success);
    font-weight:600;
}

.footer{
    margin-top:28px;
    color:#999;
    font-size:13px;
}
</style>

</head>
<body>

<div class="card">

    <div class="icon">✓</div>

    <h1>代码基础功能检查</h1>

    <div class="desc">
        已完成针对代码基础功能的检查，本次未发现异常。
    </div>

    <div class="info">
        <p>
            <span class="label">检查状态：</span>
            <span class="status">无异常</span>
        </p>

        <p>
            <span class="label">最后检查日期：</span>
            <strong>2026-08-24</strong>
        </p>
    </div>

    <div class="footer">
        检查结果仅供参考，可能存在疏漏之处。如发现问题或异常，欢迎反馈。
    </div>

</div>

</body>
</html>
