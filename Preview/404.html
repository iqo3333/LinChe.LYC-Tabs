<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

  <link rel="icon"
        href="icons/favicon.png"
        type="image/png">

<title>MeTab · 页面不存在</title>

<style>

:root{

  --bg:#050505;
  --card:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.08);
  --text:#ffffff;
  --sub:#9a9a9a;
  --accent:#ffffff;
  --blur:20px;

}

*{

  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;

}

html,
body{

  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;

}

body{

  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  color:var(--text);

}

/* ===== 背景光效 ===== */
.background{

  position:absolute;
  inset:0;
  overflow:hidden;

}

.light{

  position:absolute;
  border-radius:999px;
  filter:blur(120px);
  opacity:0.22;

}

.light.one{

  width:420px;
  height:420px;
  background:#4D7CFF;
  top:-120px;
  left:-100px;

}

.light.two{

  width:380px;
  height:380px;
  background:#FF4DA6;
  bottom:-140px;
  right:-120px;

}

.light.three{

  width:260px;
  height:260px;
  background:#7A5CFF;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

}

/* ===== 主卡片 ===== */
.container{

  width:min(92%,520px);
  position:relative;
  z-index:2;

}

.card{

  width:100%;
  padding:42px 32px;
  border-radius:28px;
  background:var(--card);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);
  box-shadow:
    0 10px 40px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.04);

}

.logo{

  font-size:14px;
  color:rgba(255,255,255,0.55);
  letter-spacing:2px;
  margin-bottom:26px;
  user-select:none;

}

.code{

  font-size:96px;
  font-weight:700;
  line-height:1;
  letter-spacing:-4px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      rgba(255,255,255,0.65)
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

}

.title{

  margin-top:18px;
  font-size:28px;
  font-weight:600;

}

.desc{

  margin-top:12px;
  color:var(--sub);
  font-size:15px;
  line-height:1.8;

}

.actions{

  display:flex;
  gap:12px;
  margin-top:34px;
  flex-wrap:wrap;

}

.btn{

  height:46px;
  padding:0 22px;
  border:none;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
  transition:0.25s;
  text-decoration:none;

}

.btn.primary{

  background:#ffffff;
  color:#000000;
  font-weight:600;

}

.btn.primary:hover{

  transform:translateY(-2px);

}

.btn.secondary{

  background:rgba(255,255,255,0.06);
  color:#ffffff;
  border:1px solid rgba(255,255,255,0.08);

}

.btn.secondary:hover{

  background:rgba(255,255,255,0.1);

}

.footer{

  margin-top:28px;
  font-size:12px;
  color:rgba(255,255,255,0.35);
  user-select:none;

}

/* ===== 浮动颗粒 ===== */
.particle{

  position:absolute;
  border-radius:999px;
  background:rgba(255,255,255,0.12);
  animation:float 8s linear infinite;

}

.particle:nth-child(1){

  width:4px;
  height:4px;
  left:10%;
  top:80%;
  animation-delay:0s;

}

.particle:nth-child(2){

  width:6px;
  height:6px;
  left:70%;
  top:85%;
  animation-delay:2s;

}

.particle:nth-child(3){

  width:3px;
  height:3px;
  left:40%;
  top:90%;
  animation-delay:4s;

}

@keyframes float{

  0%{

    transform:translateY(0);
    opacity:0;

  }

  20%{

    opacity:1;

  }

  100%{

    transform:translateY(-120px);
    opacity:0;

  }

}

/* ===== 移动端 ===== */
@media(max-width:520px){

  .card{

    padding:36px 24px;

  }

  .code{

    font-size:78px;

  }

  .title{

    font-size:24px;

  }

  .actions{

    flex-direction:column;

  }

  .btn{

    width:100%;

  }

}

</style>
</head>
<body>

<div class="background">

  <div class="light one"></div>
  <div class="light two"></div>
  <div class="light three"></div>

  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

</div>

<div class="container">

  <div class="card">

    <div class="logo">
      MeTab
    </div>

    <div class="code">
      404
    </div>

    <div class="title">
      页面不存在
    </div>

    <div class="desc">
      你访问的页面可能已被移动、删除，
      或从未存在于当前维度。
    </div>

    <div class="actions">

      <a class="btn primary"
         href="/">
         返回主页
      </a>

      <button class="btn secondary"
              onclick="history.back()">
              返回上一页
      </button>

    </div>

    <div class="footer">
      Designed for MeTab
    </div>

  </div>

</div>

<script>

const isTraditional =
  location.pathname.includes('/zh_hant');

if(isTraditional){

  document.documentElement.lang = 'zh-Hant';

  document.title = '404 · 頁面不存在';

  document.querySelector('.title')
    .textContent = '頁面不存在';

  document.querySelector('.desc')
    .innerHTML = `
      你訪問的頁面可能已被移動、刪除，或從未存在於當前維度。
    `;

  document.querySelector('.btn.primary')
    .textContent = '返回主頁';

  document.querySelector('.btn.secondary')
    .textContent = '返回上一頁';

}

</script>

</body>
</html>
