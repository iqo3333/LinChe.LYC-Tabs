<!DOCTYPE html>
<html lang="zh-CN">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 minimum-scale=1.0,
                 user-scalable=no">

  <title>MeTab – 简约美观，专注高效！</title>

  <meta name="description"
        content="告别杂乱标签页，快速访问网站或搜索内容，一切尽在掌握。林澈.LYC 标签页提供清爽界面与高效操作体验，让浏览器新标签页更简洁、智能。">

  <meta name="keywords"
        content="林澈,LYC,标签页,新标签页,浏览器主页,极简主页,搜索引擎,自定义主页">

  <meta name="author"
        content="林澈.LYC">

  <meta name="robots"
        content="index,follow">

  <meta name="theme-color"
        content="#000000">

<link rel="canonical"
      href="https://tab.iqo3333.cn/">

<link rel="alternate"
      hreflang="zh-CN"
      href="https://tab.iqo3333.cn/">

<link rel="alternate"
      hreflang="zh-HK"
      href="https://tab.iqo3333.cn/zh_hant/">

  <link rel="icon"
        href="icons/favicon.png"
        type="image/png">

  <link rel="stylesheet"
        href="styles.css">

</head>


<body>

  <!-- 背景 -->
  <video id="bg-video"
         autoplay
         loop
         muted
         playsinline
         webkit-playsinline
         preload="auto">
  </video>

  <img id="bg-image"
       alt="background">

  <!-- 遮罩 -->
  <div class="overlay"></div>

  <!-- 页面内容 -->
  <div class="content">

    <!-- 时间和日期 -->
    <div class="datetime">

      <div id="clock"></div>

      <div id="date"></div>

    </div>

<!-- 搜索框 -->
<div class="search-box">

  <div class="engine-select"
       id="engineSelect">

    <img id="engineIcon"
         src="icons/bing.png"
         alt="engine">

  </div>

  <input id="domainInput"
         type="text"
         inputmode="search"
         placeholder="搜索或输入 Web 地址..."
         autocomplete="off"
         autocorrect="off"
         autocapitalize="none"
         spellcheck="false">

  <!-- 清除按钮 -->
  <button id="clearBtn"
          type="button">

    ✕

  </button>

  <!-- 搜索按钮 -->
  <button id="goBtn"
          type="button"
          onclick="handleInput()">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2.8"
         stroke-linecap="round"
         stroke-linejoin="round">

      <path d="M3 12h16"></path>

      <path d="m12 5 7 7-7 7"></path>

    </svg>

  </button>

  <!-- 搜索引擎菜单 -->
  <div id="engineDropdown"
       class="engine-dropdown">

    <div data-engine="Bing"
         data-icon="icons/bing.png">
      Bing
    </div>

    <div data-engine="Google"
         data-icon="icons/google.png">
      Google
    </div>

    <div data-engine="Baidu"
         data-icon="icons/baidu.png">
      Baidu
    </div>

    <div data-engine="Yahoo"
         data-icon="icons/yahoo.png">
      Yahoo
    </div>

    <div data-engine="Yandex"
         data-icon="icons/yandex.png">
      Yandex
    </div>

    <div data-engine="Duckduckgo"
         data-icon="icons/duckduckgo.png">
      Duckduckgo
    </div>

  </div>

</div>

    <!-- 快捷方式 -->
    <div class="quick-links"
         id="quickLinks">

      <a href="https://www.bing.com"
         class="quick-item"
         target="_blank">

        <img class="quick-icon"
             src="icons/bing.png"
             alt="Bing">

      </a>

      <a href="https://www.google.com"
         class="quick-item"
         target="_blank">

        <img class="quick-icon"
             src="icons/google.png"
             alt="Google">

      </a>

      <a href="https://www.baidu.com"
         class="quick-item"
         target="_blank">

        <img class="quick-icon"
             src="icons/baidu.png"
             alt="Baidu">

      </a>

      <a href="https://github.com/iqo3333/MeTab"
         class="quick-item"
         target="_blank">

        <img class="quick-icon"
             src="icons/github.png"
             alt="GitHub">

      </a>

    </div>

  </div>

  <!-- 右上角按钮组 -->
  <div class="top-actions">

    <!-- 背景切换 -->
    <div class="bg-wrapper">

      <button class="bg-btn"
              id="bgBtn"
              type="button">

        <svg xmlns="http://www.w3.org/2000/svg"
             width="20"
             height="20"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.9"
             stroke-linecap="round"
             stroke-linejoin="round">

          <path d="M9 4L12 6L15 4L18 6L20 10L17 12V20H7V12L4 10L6 6L9 4Z"/>

        </svg>

      </button>

    </div>

    <!-- 繁体切换 -->
    <div class="lang-wrapper">

      <button class="lang-btn"
              type="button"
              onclick="window.location.href='zh_hant/index.html'">

        <svg xmlns="http://www.w3.org/2000/svg"
             width="18"
             height="18"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.9"
             stroke-linecap="round"
             stroke-linejoin="round">

          <circle cx="12"
                  cy="12"
                  r="9"></circle>

          <path d="M3 12h18"></path>

          <path d="M12 3a15 15 0 0 1 0 18"></path>

          <path d="M12 3a15 15 0 0 0 0 18"></path>

        </svg>

      </button>

    </div>

  </div>

  <!-- 版权 -->
  <div class="footer-center">

<!-- 页面版本 -->
<div class="version-info">

  <a href="https://github.com/iqo3333/MeTab/releases/tag/Ver.9.1.9.2"
     target="_blank"
     rel="noopener noreferrer">

    <b>页面版本：Ver.9.1.9.2</b>

  </a>

</div>

    <span>
      <b>© 林澈 2026. All Rights Reserved</b>
    </span>

  </div>

<!-- ===== 公告弹窗 ===== -->
<div id="noticeModal"
     class="notice-modal">

  <div class="notice-box">

    <!-- 标题 -->
    <div class="notice-header">

      <span>MeTab  弹窗公告</span>

    </div>

    <!-- 内容 -->
    <div id="noticeContent"
         class="notice-content">

      正在加载公告...

    </div>

    <!-- 底部按钮 -->
    <div class="notice-actions">

      <!-- 本次关闭 -->
      <button id="noticeClose">

        本次关闭

      </button>

      <!-- 不再提示 -->
      <button id="noticeHide">

        不再提示

      </button>

    </div>

  </div>

</div>

  <!-- 背景菜单动态生成 -->
  <script src="image/bg-list.js"></script>

  <!-- 主逻辑 -->
  <script src="script.js"></script>

</body>

</html>
